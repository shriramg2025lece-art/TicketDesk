<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login - College TicketDesk</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>College TicketDesk</h1>
      <p class="sub">Raise and track support tickets</p>

      <div class="error-msg" th:if="${param.error}">Invalid username or password.</div>
      <div class="alert-msg" th:if="${param.logout}">You have been logged out.</div>
      <div class="alert-msg" th:if="${param.registered}">Account created. Please sign in.</div>

      <form method="post" th:action="@{/login}">
        <div class="field" style="margin-bottom:14px;">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autofocus="autofocus"/>
        </div>
        <div class="field" style="margin-bottom:6px;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"/>
        </div>
        <button class="btn" type="submit" style="width:100%;">Sign in</button>
      </form>
      <p style="color:var(--muted); font-size:13px; margin-top:16px;">
        New student? <a class="link" th:href="@{/register}">Create an account</a>
      </p>
      <p style="color:var(--muted); font-size:12px;">
        Demo: admin / admin123, staff / staff123, student / student123
      </p>
    </div>
  </div>
</body>
</html>
