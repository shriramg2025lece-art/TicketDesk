spring.application.name=ticketdesk

# Port 8082 so it does not clash with other apps on 8080 / 8081 (override with SERVER_PORT)
server.port=${SERVER_PORT:8082}

# ---- MySQL (database is created automatically on first run) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ticketdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=shriram#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Default admin account (created on first run if missing) ----
app.admin.username=admin
app.admin.password=admin123
