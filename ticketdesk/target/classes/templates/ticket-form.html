<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>New Ticket - College TicketDesk</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: nav}"></div>
  <div class="main">
    <div class="topbar">
      <h2>New Ticket</h2>
      <form method="post" th:action="@{/logout}">
        <button type="submit">Logout (<span sec:authentication="name">user</span>)</button>
      </form>
    </div>

    <div class="panel">
      <h3>Describe your problem</h3>
      <div class="error-msg" th:if="${#fields.hasErrors('${form.*}')}">
        <div th:each="e : ${#fields.errors('${form.*}')}" th:text="${e}">error</div>
      </div>

      <form method="post" th:action="@{/tickets}" th:object="${form}">
        <div class="form-grid">
          <div class="field">
            <label>Category</label>
            <select th:field="*{category}">
              <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">CAT</option>
            </select>
          </div>
          <div class="field">
            <label>Priority</label>
            <select th:field="*{priority}">
              <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">PRI</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Title</label>
          <input type="text" th:field="*{title}" maxlength="150"/>
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Description</label>
          <textarea th:field="*{description}" rows="6" maxlength="2000"></textarea>
        </div>
        <button class="btn" type="submit">Submit Ticket</button>
      </form>
    </div>
  </div>
</body>
</html>
