# Zero-setup demo: run with  -Dspring-boot.run.profiles=h2demo   (in-memory H2, no MySQL needed)
spring.datasource.url=jdbc:h2:mem:ticketdesk;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
